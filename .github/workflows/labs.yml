name: Labs (Godot)

on:
  pull_request:
    paths:
      - "labs/**"
      - "scripts/generar_assets.py"
      - "scripts/verificar_assets.py"
      - ".github/workflows/labs.yml"
  push:
    branches: ["main"]
    paths:
      - "labs/**"
      - "scripts/generar_assets.py"
      - "scripts/verificar_assets.py"
      - ".github/workflows/labs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  godot:
    name: ${{ matrix.lab }} · ${{ matrix.proyecto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada lab se valida en sus dos versiones: la solución de referencia y
        # el proyecto de partida (el alumno debe poder abrir 'inicio' y que
        # arranque sin errores).
        lab: [plataformas-2d, 3d-tercera-persona, shaders, multijugador, ia-enemigo, ui-accesible,
              gameplay-systems, production-runtime, ai-game-system, advanced-engineering]
        proyecto: [solucion, inicio]
        # 'marcador' es la prueba POSITIVA de cada lab: la línea que el proyecto
        # tiene que imprimir para demostrar que no solo arrancó, sino que llegó a
        # construir lo suyo. Sin esto, un proyecto que no hace nada pasaría el
        # test solo por no fallar.
        include:
          - lab: plataformas-2d
            marcador: "Nivel construido:"
          - lab: 3d-tercera-persona
            marcador: "Nivel construido:"
          - lab: shaders
            marcador: "Galería construida:"
          # Sin ventana y sin argumentos, el lab de multijugador se arranca como
          # servidor dedicado (clase 151): eso es justo lo que hace este job.
          - lab: multijugador
            marcador: "Servidor escuchando:"
          - lab: ia-enemigo
            marcador: "Nivel construido:"
          - lab: ui-accesible
            marcador: "UI construida:"
          - lab: gameplay-systems
            marcador: "Mundo construido:"
          - lab: production-runtime
            marcador: "Runtime construido:"
          - lab: ai-game-system
            marcador: "Sistema IA construido:"
          - lab: advanced-engineering
            marcador: "Banco listo:"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Descargar Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL "$URL" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Comprobar que los assets versionados coinciden con el generador
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          # Compara CONTENIDO (píxeles y muestras), no bytes: el encoder PNG de
          # Pillow no produce los mismos bytes entre versiones/plataformas.
          python scripts/verificar_assets.py

      - name: Importar el proyecto (valida escenas, recursos y shaders)
        run: |
          set -euo pipefail
          PROY="labs/${{ matrix.lab }}/${{ matrix.proyecto }}"
          # Se importa DOS veces y solo se juzga la segunda, y no es por vicio:
          # el primer import es el que genera los artefactos derivados (las
          # traducciones compiladas del lab de UI, por ejemplo), pero el motor
          # ya intenta cargarlos al arrancar — así que en un checkout limpio la
          # primera pasada se queja de archivos que ella misma está creando. La
          # segunda parte de un proyecto ya importado, que es como lo verá quien
          # abra el editor, y esa sí tiene que estar impecable.
          godot --headless --path "$PROY" --import > /dev/null 2>&1 || true
          # El import puede devolver != 0 aunque tenga éxito; lo que importa es
          # que no aparezcan errores en el log.
          godot --headless --path "$PROY" --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|SHADER ERROR|Failed loading resource" import.log; then
            echo "::error::${{ matrix.lab }}/${{ matrix.proyecto }} no importa limpio"
            exit 1
          fi
          echo "Import limpio ✔"

      - name: "Arrancar headless (smoke test: ejecuta _ready y varios frames)"
        run: |
          set -euo pipefail
          PROY="labs/${{ matrix.lab }}/${{ matrix.proyecto }}"
          MARCADOR="${{ matrix.marcador }}"
          # Si un lab nuevo se añade a la matriz y se olvida su 'include', el
          # marcador llega vacío y 'grep -q ""' daría por bueno cualquier log.
          # Mejor fallar aquí que tener una prueba positiva que no prueba nada.
          if [ -z "$MARCADOR" ]; then
            echo "::error::${{ matrix.lab }}: falta 'marcador' en el include de la matriz"
            exit 1
          fi
          godot --headless --path "$PROY" --quit-after 300 2>&1 | tee run.log || true
          # Godot compila el GLSL aunque no haya GPU: un shader roto sale aquí.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|SHADER ERROR|Failed loading resource|Cannot call method" run.log; then
            echo "::error::${{ matrix.lab }}/${{ matrix.proyecto }} lanza errores en tiempo de ejecución"
            exit 1
          fi
          # Prueba POSITIVA: no basta con que no falle, tiene que construirse.
          if ! grep -qF "$MARCADOR" run.log; then
            echo "::error::${{ matrix.lab }}/${{ matrix.proyecto }}: falta el marcador '$MARCADOR'"
            cat run.log
            exit 1
          fi
          grep -F "$MARCADOR" run.log
          echo "Arranque y construcción verificados ✔"

      - name: Resumen
        if: always()
        run: |
          PROY="labs/${{ matrix.lab }}/${{ matrix.proyecto }}"
          {
            echo "### 🎮 Lab ${{ matrix.lab }} · ${{ matrix.proyecto }}"
            echo ""
            echo "- Godot: **${GODOT_VERSION}** (headless)"
            echo "- Scripts GDScript: **$(find "$PROY" -name '*.gd' | wc -l)**"
            echo "- Escenas: **$(find "$PROY" -name '*.tscn' | wc -l)**"
            echo "- Shaders: **$(find "$PROY" -name '*.gdshader' | wc -l)**"
          } >> "$GITHUB_STEP_SUMMARY"

  # El lab de multijugador necesita algo que los demás no: comprobar que dos
  # procesos hablan entre sí de verdad. El job de arriba solo verifica que el
  # servidor arranca; este levanta un servidor y tres clientes headless contra
  # él y comprueba que la red hace su trabajo.
  #
  # Solo corre sobre 'solucion': 'inicio' tiene los TODO sin hacer, así que no
  # predice ni valida nada y no podría pasar estas comprobaciones. Es lo
  # esperado, no un fallo.
  red:
    name: multijugador · prueba de red real
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Descargar Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL "$URL" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Importar
        run: |
          set -euo pipefail
          godot --headless --path labs/multijugador/solucion --import > import.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::el lab de multijugador no importa limpio"
            exit 1
          fi

      - name: Levantar servidor y clientes
        run: |
          set -euo pipefail
          PROY="labs/multijugador/solucion"

          # El servidor vive más que los clientes para poder ver sus bajas.
          godot --headless --path "$PROY" -- --server --segundos 30 > server.log 2>&1 &

          # Esperar a que escuche de verdad en vez de dormir a ciegas: en un
          # runner cargado, un sleep fijo es una promesa que no se cumple.
          for i in $(seq 1 30); do
            grep -q "Servidor escuchando:" server.log && break
            sleep 1
          done
          if ! grep -q "Servidor escuchando:" server.log; then
            echo "::error::el servidor no llegó a escuchar"
            cat server.log
            exit 1
          fi

          # Dos clientes honestos (bots con un patrón fijo) y uno tramposo.
          godot --headless --path "$PROY" -- --conectar 127.0.0.1 --bot --segundos 12 > c1.log 2>&1 &
          C1=$!
          godot --headless --path "$PROY" -- --conectar 127.0.0.1 --bot --segundos 12 > c2.log 2>&1 &
          C2=$!
          godot --headless --path "$PROY" -- --conectar 127.0.0.1 --tramposo --segundos 12 > cheat.log 2>&1 &
          C3=$!
          wait $C1 $C2 $C3 || true

          # Que al servidor le dé tiempo a ver las desconexiones y cerrar.
          for i in $(seq 1 30); do
            grep -q "Informe de SERVIDOR" server.log && break
            sleep 1
          done

      - name: Comprobar que la red hizo su trabajo
        run: |
          set -euo pipefail
          fallos=0
          fallo() { echo "::error::$1"; fallos=$((fallos + 1)); }

          # 1) Nadie puede haber soltado un error. Con UNA excepción, y conviene
          #    explicarla porque un filtro sin motivo es como no tener prueba:
          #
          #    "Unable to send packet on channel 0" lo emite ENet cuando un peer
          #    se desconecta y todavía había algo en vuelo hacia él. Es una
          #    carrera del motor, no del lab: se comprobó desactivando los RPC
          #    del lab y el mensaje sigue apareciendo (lo emiten el
          #    MultiplayerSynchronizer y el Spawner al despawnear). Desde
          #    GDScript no se puede cerrar esa ventana, así que se filtra ESE
          #    mensaje y solo ese; cualquier otro error sigue tumbando el job.
          for f in server.log c1.log c2.log cheat.log; do
            if grep -E "SCRIPT ERROR|Parse Error|ERROR:|Cannot call method" "$f" \
                 | grep -v "Unable to send packet on channel"; then
              fallo "$f contiene errores"
            fi
          done

          # 2) Los tres clientes llegaron al servidor.
          conectados=$(grep -c "Peer conectado:" server.log || true)
          [ "$conectados" -ge 3 ] || fallo "el servidor solo vio $conectados peer(s), esperaba 3"

          # 3) El spawner replicó los avatares: cada cliente ve el suyo Y los ajenos.
          grep -q "Avatar recibido del servidor.*el mío" c1.log \
            || fallo "el cliente 1 no recibió su propio avatar"
          grep -q "Avatar recibido del servidor.*remoto" c1.log \
            || fallo "el cliente 1 no vio a los demás jugadores"

          # 4) El ciclo input -> validación -> confirmación cierra.
          confirmaciones=$(sed -n 's/.*(local): \([0-9]*\) confirmacion.*/\1/p' c1.log | head -1)
          confirmaciones=${confirmaciones:-0}
          [ "$confirmaciones" -gt 20 ] \
            || fallo "el cliente 1 solo recibió $confirmaciones confirmación(es) del servidor"

          # 5) La predicción ACIERTA. Si el cliente y el servidor no hicieran la
          #    misma cuenta, el servidor lo corregiría en casi todos los paquetes
          #    (el efecto goma). Toleramos un 20%: alguna corrección real puede
          #    haber, porque el transporte es unreliable y se pierden inputs.
          correcciones=$(sed -n 's/.*(local): [0-9]* confirmacion(es), \([0-9]*\) correccion.*/\1/p' c1.log | head -1)
          correcciones=${correcciones:-999}
          limite=$((confirmaciones / 5))
          [ "$correcciones" -le "$limite" ] \
            || fallo "predicción divergente: $correcciones corrección(es) sobre $confirmaciones confirmación(es) (máx $limite)"

          # 6) El servidor rechaza al tramposo: el anti-cheat no es decorativo.
          rechazos=$(grep -c "Input rechazado" server.log || true)
          [ "$rechazos" -gt 0 ] \
            || fallo "el servidor no rechazó ni un input del cliente --tramposo"

          # 7) Al irse los clientes, sus avatares desaparecen sin ruido.
          grep -q "Avatar retirado del peer" server.log \
            || fallo "el servidor no limpió los avatares al desconectar"

          echo ""
          echo "peers vistos: $conectados · confirmaciones: $confirmaciones · correcciones: $correcciones (máx $limite) · inputs rechazados al tramposo: $rechazos"
          {
            echo "### 🌐 Prueba de red (servidor + 3 clientes headless)"
            echo ""
            echo "- Peers conectados: **$conectados**"
            echo "- Confirmaciones recibidas por un cliente: **$confirmaciones**"
            echo "- Correcciones de reconciliación: **$correcciones** (máx tolerado: $limite)"
            echo "- Inputs rechazados al cliente tramposo: **$rechazos**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fallos" -gt 0 ]; then
            echo "--- server.log ---"; cat server.log
            echo "--- c1.log ---"; cat c1.log
            exit 1
          fi
          echo "La red funciona ✔"

  # Que el lab de IA arranque no dice nada: un enemigo plantado también arranca.
  # Este job lo pone a prueba de verdad — mueve al jugador por un circuito fijo y
  # exige que el árbol RECORRA sus ramas: patrulla, te ve y persigue, te pierde y
  # busca, y vuelve a patrullar.
  #
  # Se puede exigir eso en CI porque el lab usa AStarGrid2D (síncrono y
  # determinista) y un bot con recorrido fijo: la misma entrada da siempre la
  # misma secuencia. Con NavigationAgent2D —que responde por señal cuando el
  # servidor termina— esta prueba sería inestable, y una prueba inestable es
  # peor que no tenerla.
  #
  # Solo sobre 'solucion': 'inicio' tiene los TODO sin hacer y su enemigo es
  # ciego. Es lo esperado, no un fallo.
  ia:
    name: ia-enemigo · prueba de comportamiento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Descargar Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL "$URL" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Importar
        run: |
          set -euo pipefail
          godot --headless --path labs/ia-enemigo/solucion --import > import.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::el lab de IA no importa limpio"
            exit 1
          fi

      - name: Poner a prueba el árbol
        run: |
          set -euo pipefail
          godot --headless --path labs/ia-enemigo/solucion --quit-after 1500 -- --bot 2>&1 | tee ia.log || true

          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|Cannot call method" ia.log; then
            echo "::error::el lab de IA lanza errores en tiempo de ejecución"
            exit 1
          fi

          fallos=0
          fallo() { echo "::error::$1"; fallos=$((fallos + 1)); }

          # La secuencia de estados, en orden y sin repetir seguidos: es lo que
          # el enemigo ha DECIDIDO durante la partida. El sed final quita el
          # espacio que deja tr, que si no rompe el patrón *"patrulla" de abajo.
          secuencia=$(sed -n 's/^IA: //p' ia.log | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          echo "Secuencia decidida por el árbol: $secuencia"

          # 1) Empieza patrullando (nadie a la vista).
          case "$secuencia" in
            "patrulla"*) ;;
            *) fallo "el enemigo no empieza patrullando: '$secuencia'" ;;
          esac

          # 2) Ve al jugador y lo persigue: la rama de combate gana a la patrulla.
          echo "$secuencia" | grep -q "persecucion" \
            || fallo "el enemigo nunca detectó al jugador (percepción o prioridad del selector)"

          # 3) Lo pierde y va a buscarlo: la memoria funciona.
          echo "$secuencia" | grep -q "busqueda" \
            || fallo "el enemigo no fue a buscar tras perder de vista al jugador (memoria)"

          # 4) Y acaba volviendo a patrullar: no se queda colgado buscando.
          case "$secuencia" in
            *"patrulla") ;;
            *) fallo "el enemigo no volvió a patrullar al final: '$secuencia'" ;;
          esac

          {
            echo "### 🧠 Prueba de comportamiento del árbol"
            echo ""
            echo "Secuencia decidida: \`$secuencia\`"
            echo ""
            echo "- Patrulla → detecta → persigue → pierde → busca → vuelve a patrullar"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fallos" -gt 0 ]; then
            cat ia.log
            exit 1
          fi
          echo "El árbol decide de verdad ✔"

  # La UI de Godot se calcula en la CPU: el layout, el foco y lo que ocupa un
  # texto se resuelven sin GPU — solo el dibujado necesita tarjeta. Así que un
  # runner sin pantalla sí puede responder a lo que importa: si hay foco, si la
  # navegación da la vuelta, si cambia el idioma de TODA la UI, y si el texto al
  # 200 % sigue cabiendo. Esto último es lo que el capstone (clase 199) llama su
  # corazón, y aquí es un assert.
  #
  # Lo que NO comprueba: si la UI se ve bonita. Eso lo juzga una persona.
  #
  # Solo sobre 'solucion': 'inicio' tiene los TODO sin hacer y su menú ni siquiera
  # tiene foco. Es lo esperado, no un fallo.
  ui:
    name: ui-accesible · prueba de la interfaz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Descargar Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL "$URL" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Importar
        run: |
          set -euo pipefail
          # Doble import: la primera pasada compila el CSV de traducciones que el
          # propio project.godot referencia (ver el job de arriba).
          godot --headless --path labs/ui-accesible/solucion --import > /dev/null 2>&1 || true
          godot --headless --path labs/ui-accesible/solucion --import > import.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::el lab de UI no importa limpio"
            exit 1
          fi

      - name: Probar la interfaz
        run: |
          set -euo pipefail
          godot --headless --path labs/ui-accesible/solucion res://escenas/verificar.tscn 2>&1 | tee ui.log || true

          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|Cannot call method" ui.log; then
            echo "::error::el lab de UI lanza errores en tiempo de ejecución"
            exit 1
          fi

          # El verificador cuenta lo suyo; aquí se exige que haya corrido entero
          # y sin un solo fallo.
          resumen=$(sed -n 's/^== \([0-9]*\) comprobaciones, \([0-9]*\) fallo.*/\1 \2/p' ui.log | head -1)
          hechas=$(echo "$resumen" | cut -d' ' -f1)
          fallos=$(echo "$resumen" | cut -d' ' -f2)
          hechas=${hechas:-0}
          fallos=${fallos:-99}

          if [ "$hechas" -lt 15 ]; then
            echo "::error::solo se ejecutaron $hechas comprobaciones (esperaba 15+): ¿se cortó a media prueba?"
            cat ui.log
            exit 1
          fi
          if [ "$fallos" -ne 0 ]; then
            echo "::error::$fallos comprobación(es) de UI han fallado"
            cat ui.log
            exit 1
          fi

          echo "comprobaciones: $hechas · fallos: $fallos"
          {
            echo "### 🖥️ Prueba de la interfaz"
            echo ""
            echo "- Comprobaciones: **$hechas**, fallos: **$fallos**"
            echo "- Foco y navegación cíclica · idioma en runtime (incluidos textos por código)"
            echo "- Texto al 100/150/200 % sin recortes · 16:9, 21:9 y 4:3"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "La UI aguanta ✔"

  # Los cuatro labs de las Partes 18-21 no son escenas que se miran: son sistemas
  # que se prueban. Cada uno trae su propia suite y este job la ejecuta entera.
  #
  # El umbral 'minimo' NO es decorativo: sin él, una suite que se corta a la
  # tercera comprobación reportaría "0 fallos" y el job pasaría en verde. Se
  # exige un número de comprobaciones cercano al real, así que borrar pruebas
  # para que deje de fallar tampoco cuela.
  #
  # Solo sobre 'solucion': 'inicio' tiene los TODO sin hacer y sus pruebas deben
  # fallar — es su razón de ser. El job de arriba ya verifica que 'inicio'
  # importa y arranca limpio, que es lo que se le puede exigir.
  sistemas:
    name: ${{ matrix.lab }} · suite de pruebas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lab: gameplay-systems
            script: res://pruebas/sistemas_test.gd
            minimo: 110
            titulo: "🎒 Sistemas de gameplay"
            detalle: "Apilado y transacciones atómicas · equipo y modificadores · efectos con conteo por fuente · quests · migraciones de guardado v1→v3"
          - lab: production-runtime
            script: res://pruebas/runtime_test.gd
            minimo: 85
            titulo: "☁️ Runtime de producción"
            detalle: "Reintentos con jitter · circuit breaker · idempotencia · feature flags deterministas · telemetría con taxonomía · saves atómicos con checksum"
          - lab: ai-game-system
            script: res://pruebas/ia_test.gd
            minimo: 50
            titulo: "🤖 Sistema de IA en el juego"
            detalle: "Siete ataques de prompt injection sin efecto en el juego · lore con visibilidad · degradación sin IA · caché normalizada. Sin red y sin claves."
          - lab: advanced-engineering
            script: res://pruebas/ingenieria_test.gd
            minimo: 30
            titulo: "⚙️ Ingeniería avanzada"
            detalle: "SoA==AoS · rejilla==fuerza bruta · pool y arena · grafo de tareas con detección de ciclos · paralelo determinista en 50 pasadas"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Descargar Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL "$URL" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Importar
        run: |
          set -euo pipefail
          godot --headless --path "labs/${{ matrix.lab }}/solucion" --import > import.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log; then
            echo "::error::el lab ${{ matrix.lab }} no importa limpio"
            cat import.log
            exit 1
          fi

      - name: Ejecutar la suite
        run: |
          set -euo pipefail
          godot --headless --path "labs/${{ matrix.lab }}/solucion" \
                --script "${{ matrix.script }}" 2>&1 | tee test.log || true

          # Un error del motor invalida el resultado aunque el contador diga 0
          # fallos: si algo dejó de cargar, lo que se probó no es lo que hay.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|Cannot call method|leaked" test.log; then
            echo "::error::${{ matrix.lab }} lanza errores durante las pruebas"
            exit 1
          fi

          resumen=$(sed -n 's/^== \([0-9]*\) comprobaciones, \([0-9]*\) fallo.*/\1 \2/p' test.log | head -1)
          hechas=$(echo "$resumen" | cut -d' ' -f1)
          fallos=$(echo "$resumen" | cut -d' ' -f2)
          hechas=${hechas:-0}
          fallos=${fallos:-99}

          if [ "$hechas" -lt "${{ matrix.minimo }}" ]; then
            echo "::error::solo se ejecutaron $hechas comprobaciones (esperaba ${{ matrix.minimo }}+): ¿se cortó a media suite?"
            cat test.log
            exit 1
          fi
          if [ "$fallos" -ne 0 ]; then
            echo "::error::$fallos comprobación(es) han fallado en ${{ matrix.lab }}"
            cat test.log
            exit 1
          fi

          echo "comprobaciones: $hechas · fallos: $fallos"
          {
            echo "### ${{ matrix.titulo }}"
            echo ""
            echo "- Comprobaciones: **$hechas**, fallos: **$fallos**"
            echo "- ${{ matrix.detalle }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "La suite pasa ✔"

  # Los labs de las Partes 18-21 prometen funcionar sin red, sin claves de API y
  # sin servicios de pago. Una promesa que no se comprueba dura hasta el primer
  # despiste, así que aquí se comprueba: si alguien añade una llamada HTTP o una
  # clave, este job lo dice antes de que llegue a main.
  #
  # No sustituye al workflow de seguridad (que escanea el repo entero): es una
  # verificación específica del contrato de estos cuatro laboratorios.
  offline:
    name: labs 18-21 · sin red y sin claves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Comprobar que no hay llamadas de red ni credenciales
        run: |
          set -euo pipefail
          LABS="labs/gameplay-systems labs/production-runtime labs/ai-game-system labs/advanced-engineering"
          fallos=0
          fallo() { echo "::error::$1"; fallos=$((fallos + 1)); }

          # 1) Nada de red en el código GDScript. El lab de runtime simula un
          #    backend hostil con un mock en memoria: no necesita salir a
          #    internet, y ese es justo el punto.
          if grep -rnE "HTTPRequest|HTTPClient|StreamPeerTCP|StreamPeerTLS|PacketPeerUDP|ENetMultiplayerPeer|WebSocketPeer" \
               --include="*.gd" $LABS; then
            fallo "hay clases de red en unos labs que deben funcionar offline"
          fi

          # 2) Ninguna URL http(s) real. Se permiten las de documentación en
          #    comentarios de godotengine.org y las rutas res:// del motor.
          if grep -rnE "https?://" --include="*.gd" --include="*.json" --include="*.godot" $LABS \
               | grep -vE "godotengine\.org|docs\.godotengine"; then
            fallo "hay URLs externas en los labs offline"
          fi

          # 3) Nada que se parezca a una clave. El patrón busca asignaciones con
          #    valor largo, no la palabra suelta: 'api_key' como nombre de campo
          #    en un ejemplo de configuración es legítimo; un valor de 20+
          #    caracteres al lado, no.
          if grep -rniE "(api[_-]?key|secret|token|password|bearer)[\"' ]*[:=][\"' ]*[A-Za-z0-9_\-]{20,}" \
               --include="*.gd" --include="*.json" --include="*.cfg" --include="*.godot" $LABS; then
            fallo "hay algo con pinta de credencial en los labs"
          fi

          if [ "$fallos" -gt 0 ]; then
            exit 1
          fi
          {
            echo "### 🔒 Contrato de los labs 18–21"
            echo ""
            echo "- Sin clases de red · sin URLs externas · sin credenciales"
            echo "- La CI ejecuta estos cuatro laboratorios **completamente offline**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Los labs cumplen su contrato offline ✔"
