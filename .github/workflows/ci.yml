name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estructura:
    name: Estructura y enlaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar estructura, secciones y enlaces internos
        run: python scripts/validar_estructura.py

      - name: Validar codificación (UTF-8 sin mojibake)
        # El curso se escribe en español y con emoji en casi cada título: basta
        # con que una herramienta reescriba un archivo como cp1252 para que
        # «física» pase a «fÃ­sica» sin que nada falle. Esto lo detecta.
        run: python scripts/validar_encoding.py

      - name: Comprobar que el índice y el glosario están sincronizados
        run: |
          set -euo pipefail
          # Ambos se generan desde las clases: si alguien añade una clase y no
          # regenera, la documentación queda mintiendo. Aquí se detecta.
          python scripts/generar_indice.py
          python scripts/generar_glosario.py
          if ! git diff --quiet -- classes/README.md classes/_manifest.json glosario/README.md; then
            echo "::error::índice/manifest/glosario desactualizados. Ejecuta: python scripts/generar_indice.py && python scripts/generar_glosario.py"
            git diff --stat -- classes/README.md classes/_manifest.json glosario/README.md
            exit 1
          fi
          # La navegación entre clases es lo primero que se rompe al insertar o
          # reordenar una clase, y se rompe en silencio: los enlaces siguen
          # resolviendo, solo que a la clase equivocada.
          python scripts/generar_navegacion.py --check
          echo "Documentación generada sincronizada ✔"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### 🎮 Programa de Desarrollo de Videojuegos Moderno"
            echo ""
            echo "- Partes construidas: **$(find classes -mindepth 1 -maxdepth 1 -type d -name 'parte-*' | wc -l)**"
            echo "- Clases construidas: **$(find classes -mindepth 3 -name README.md | wc -l)**"
          } >> "$GITHUB_STEP_SUMMARY"

  fuentes:
    name: Registro de fuentes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar el registro de fuentes (offline)
        # Sin red a propósito: si la red entra en un gate que bloquea, el gate
        # falla por causas ajenas al repositorio y se acaba ignorando. Lo que
        # sale a la red es scripts/refresh-sources, en su propio workflow y sin
        # bloquear. Aquí se comprueba que el registro parsea, que cada libro
        # lleva un ISBN-13 con dígito de control válido, que cada artículo
        # lleva DOI, que toda fuente citada en una clase está registrada, que
        # ninguna entrada sobra, que los enlaces al motor apuntan a la versión
        # anclada y que las cifras del README las produjo este script.
        run: python scripts/verify-sources

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2 "**/*.md"

  generar-sitio:
    name: Build del sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del generador
        run: python -m pip install "markdown>=3.6"

      - name: Generar sitio (verifica que compila)
        run: python scripts/generar_sitio.py
